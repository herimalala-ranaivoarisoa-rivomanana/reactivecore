name: Validate ReactiveCore
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test packages/client/test/offline.test.mjs
      - run: npm test
      - run: node scripts/test-infra.mjs
      - name: Verify PostgreSQL integration and retention
        env:
          RC_RETENTION_TEST: '1'
        run: node --env-file=.env.reactivecore-test scripts/test-project.mjs
