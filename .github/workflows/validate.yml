name: Validate ReactiveCore
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/module05-lab.mjs setup
      - run: node scripts/module05-lab.mjs test
      - run: node scripts/module05-lab.mjs platform-setup
      - run: bash scripts/test-platform.sh
